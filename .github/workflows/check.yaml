name: Check

on:
  push:
    branches:
      - "**"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dev-tools
        run: pnpm build:dev-tools

      - name: Rebuild bin for dev-tools
        run: pnpm rebuild @sw-file-lib/dev-tools

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build
